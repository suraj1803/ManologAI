<!DOCTYPE html>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {

  /* Entity Styles */

  .entity-header { font-size: 17px; font-weight: 800; fill: #ffffff; }
  .entity-sub { font-size: 13px; font-weight: 500; fill: #a5b4fc; }
  
  /* Process Styles */
  .process-box { fill: #0f172a; stroke-width: 2.5; rx: 18; filter: drop-shadow(0 10px 25px rgba(0,0,0,0.5)); }
  .p-auth { stroke: #ec4899; }
  .p-gate { stroke: #f59e0b; }
  .p-ingest { stroke: #3b82f6; }
  .p-analytics { stroke: #a855f7; }

  .proc-num { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 800; }
  .proc-title { font-size: 16.5px; font-weight: 700; fill: #ffffff; }
  .proc-desc { font-size: 12px; fill: #94a3b8; }

  .datastore-bg { fill: #0d1527; stroke: #38bdf8; stroke-width: 2; rx: 8; }
  .datastore-bar { fill: #38bdf8; }
  .ds-id { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 800; fill: #38bdf8; }
  .ds-title { font-size: 14px; font-weight: 700; fill: #f8fafc; }
  .ds-fields { font-size: 11px; fill: #64748b; font-family: 'JetBrains Mono', monospace; }
  
  /* Flows */
  .flow-line { fill: none; stroke-width: 2.2; stroke-linecap: round; }
  .flow-label { font-size: 11px; font-weight: 600; fill: #cbd5e1; font-family: 'Inter', sans-serif; }
  .flow-label-bg { fill: #090d16; rx: 4; stroke: rgba(255,255,255,0.15); stroke-width: 1; }
  
  /* Legend & Notes */
  .legend-box { fill: #0f172a; stroke: #334155; stroke-width: 1.5; rx: 12; }
</style>
</head>
