<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ManologAI - Comprehensive UML Class Diagram</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #090d16;
    font-family: 'Inter', -apple-system, sans-serif;
    color: #e2e8f0;
    width: 2600px;
    height: 1800px;
    padding: 25px;
    display: flex;
    flex-direction: column;
  }
  svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }
  .title-text { font-size: 32px; font-weight: 800; fill: #ffffff; letter-spacing: -0.5px; }
  .subtitle-text { font-size: 15px; font-weight: 500; fill: #94a3b8; }
  .badge-academic { font-size: 12px; font-weight: 700; fill: #818cf8; font-family: 'JetBrains Mono', monospace; }
  
  /* UML Class Card Styles */
  .uml-class { fill: #0f172a; stroke-width: 2; rx: 10; filter: drop-shadow(0 10px 24px rgba(0,0,0,0.6)); }
  .uml-class-header { rx: 10 10 0 0; }
  
  .c-user { stroke: #6366f1; }
  .c-user .uml-class-header { fill: #312e81; }
  
  .c-entity { stroke: #38bdf8; }
  .c-entity .uml-class-header { fill: #075985; }

  .c-data { stroke: #06b6d4; }
  .c-data .uml-class-header { fill: #0e7490; }

  .c-service { stroke: #ec4899; }
  .c-service .uml-class-header { fill: #831843; }

  .c-engine { stroke: #a855f7; }
  .c-engine .uml-class-header { fill: #581c87; }
  
  .stereotype { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; fill: #93c5fd; text-anchor: middle; }
  .class-title { font-size: 16px; font-weight: 800; fill: #ffffff; text-anchor: middle; }
  
  .divider { stroke: rgba(255,255,255,0.12); stroke-width: 1; }
  
  .attr-text { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; fill: #cbd5e1; }
  .method-text { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; fill: #93c5fd; }
  .vis-pub { fill: #34d399; font-weight: 700; }
  .vis-priv { fill: #f87171; font-weight: 700; }
  
  /* Relationships */
  .rel-line { fill: none; stroke-width: 2.2; }
  .rel-label { font-size: 11px; font-weight: 700; font-family: 'JetBrains Mono', monospace; fill: #cbd5e1; }
  .mult-text { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; fill: #fbbf24; }
  
  .legend-box { fill: #0f172a; stroke: #334155; stroke-width: 1.5; rx: 12; }
</style>
</head>
<body>

<svg viewBox="0 0 2550 1750" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="uml-nav" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#818cf8"/>
    </marker>
    <marker id="uml-dep" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc"/>
    </marker>
    <!-- Diamond for composition -->
    <marker id="diamond-comp" viewBox="0 0 16 10" refX="0" refY="5" markerWidth="10" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 5 L 8 1 L 16 5 L 8 9 z" fill="#6366f1" stroke="#818cf8" stroke-width="1.5"/>
    </marker>
    <!-- Diamond for aggregation -->
    <marker id="diamond-agg" viewBox="0 0 16 10" refX="0" refY="5" markerWidth="10" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 5 L 8 1 L 16 5 L 8 9 z" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8"/>
    </marker>
  </defs>

  <!-- ==================== ACADEMIC BANNER HEADER ==================== -->
  <g id="header" transform="translate(40, 20)">
    <rect width="2470" height="90" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <text x="30" y="42" class="title-text">ManologAI — Comprehensive UML 2.5 Class Diagram</text>
    <text x="30" y="70" class="subtitle-text">Entity Data Models, Structural Relationships, Controller Services &amp; Analytical Behavioral Pipeline</text>
    <text x="2440" y="42" text-anchor="end" class="badge-academic">GURU GHASIDAS VISHWAVIDYALAYA (A CENTRAL UNIVERSITY)</text>
    <text x="2440" y="68" text-anchor="end" font-size="13px" fill="#94a3b8">B.Tech IT Sem 7 (2026-27) • Supervisor: Dr. Amit Kumar Khaskalam • Team: Brijesh (23036115), Narendra (23036134), Suraj (23036168)</text>
  </g>

  <!-- ========================================================================= -->
  <!-- ROW 1: CONTROLLER & SERVICE TIER                                          -->
  <!-- ========================================================================= -->

  <!-- AuthController -->
  <g id="c-auth" transform="translate(60, 150)">
    <rect width="400" height="230" class="uml-class c-service"/>
    <path d="M 0 10 Q 0 0 10 0 L 390 0 Q 400 0 400 10 L 400 48 L 0 48 Z" fill="#831843"/>
    <text x="200" y="22" class="stereotype">&laquo;Controller / Router&raquo;</text>
    <text x="200" y="40" class="class-title">AuthController</text>
    <line x1="0" y1="48" x2="400" y2="48" class="divider"/>
    <g transform="translate(16, 68)">
      <text x="0" y="0" class="attr-text"><tspan class="vis-priv">-</tspan> JWT_SECRET: String = process.env.JWT_SECRET</text>
      <text x="0" y="20" class="attr-text"><tspan class="vis-priv">-</tspan> REFRESH_SECRET: String = process.env.REFRESH_SECRET</text>
      <text x="0" y="40" class="attr-text"><tspan class="vis-priv">-</tspan> cookieOptions: CookieConfig { httpOnly, sameSite }</text>
    </g>
    <line x1="0" y1="125" x2="400" y2="125" class="divider"/>
    <g transform="translate(16, 145)">
      <text x="0" y="0" class="method-text"><tspan class="vis-pub">+</tspan> signup(req: Request, res: Response): Promise&lt;JSON&gt;</text>
      <text x="0" y="20" class="method-text"><tspan class="vis-pub">+</tspan> login(req: Request, res: Response): Promise&lt;JSON&gt;</text>
      <text x="0" y="40" class="method-text"><tspan class="vis-pub">+</tspan> refresh(req: Request, res: Response): Promise&lt;JSON&gt;</text>
      <text x="0" y="60" class="method-text"><tspan class="vis-pub">+</tspan> revokeSession(sessionId: String): Promise&lt;JSON&gt;</text>
    </g>
  </g>

  <!-- PushNotificationService -->
  <g id="c-push" transform="translate(860, 150)">
    <rect width="460" height="230" class="uml-class c-service"/>
    <path d="M 0 10 Q 0 0 10 0 L 450 0 Q 460 0 460 10 L 460 48 L 0 48 Z" fill="#831843"/>
    <text x="230" y="22" class="stereotype">&laquo;Daemon / Background Service&raquo;</text>
    <text x="230" y="40" class="class-title">PushNotificationService</text>
    <line x1="0" y1="48" x2="460" y2="48" class="divider"/>
    <g transform="translate(16, 68)">
      <text x="0" y="0" class="attr-text"><tspan class="vis-priv">-</tspan> VAPID_PUBLIC_KEY: String (RFC 8292)</text>
      <text x="0" y="20" class="attr-text"><tspan class="vis-priv">-</tspan> VAPID_PRIVATE_KEY: String</text>
      <text x="0" y="40" class="attr-text"><tspan class="vis-priv">-</tspan> cronInterval: NodeJS.Timeout (60000ms tick)</text>
    </g>
    <line x1="0" y1="125" x2="460" y2="125" class="divider"/>
    <g transform="translate(16, 145)">
      <text x="0" y="0" class="method-text"><tspan class="vis-pub">+</tspan> initPushScheduler(): void</text>
      <text x="0" y="20" class="method-text"><tspan class="vis-pub">+</tspan> checkAndSendReminders(): Promise&lt;void&gt;</text>
      <text x="0" y="40" class="method-text"><tspan class="vis-pub">+</tspan> sendPushNotification(sub: PushSubscription, p: Payload): Status</text>
      <text x="0" y="60" class="method-text"><tspan class="vis-pub">+</tspan> pruneExpiredEndpoints(userId: ObjectId, endpoints: String[]): void</text>
    </g>
  </g>

  <!-- InsightEngine (Behavioral Intelligence) -->
  <g id="c-engine" transform="translate(1700, 150)">
    <rect width="520" height="230" class="uml-class c-engine"/>
    <path d="M 0 10 Q 0 0 10 0 L 510 0 Q 520 0 520 10 L 520 48 L 0 48 Z" fill="#581c87"/>
    <text x="260" y="22" class="stereotype">&laquo;Analytics Engine / Statistical Service&raquo;</text>
    <text x="260" y="40" class="class-title">InsightEngine</text>
    <line x1="0" y1="48" x2="520" y2="48" class="divider"/>
    <g transform="translate(16, 68)">
      <text x="0" y="0" class="attr-text"><tspan class="vis-priv">-</tspan> EMOTION_SCORES: Map&lt;String, Number&gt; = {excited: 5.0, ...}</text>
      <text x="0" y="20" class="attr-text"><tspan class="vis-priv">-</tspan> HABIT_IMPACT_THRESHOLD: Number = 1.0 (min delta)</text>
      <text x="0" y="40" class="attr-text"><tspan class="vis-priv">-</tspan> HABIT_IMPACT_MIN_SAMPLES: Number = 2 (noise filter)</text>
    </g>
    <line x1="0" y1="125" x2="520" y2="125" class="divider"/>
    <g transform="translate(16, 145)">
      <text x="0" y="0" class="method-text"><tspan class="vis-pub">+</tspan> computePearsonCorrelation(x: Number[], y: Number[]): { r, strength, dir }</text>
      <text x="0" y="20" class="method-text"><tspan class="vis-pub">+</tspan> computeHabitImpactData(ratings: LifeRating[], habits: Habit[]): Impact[]</text>
      <text x="0" y="40" class="method-text"><tspan class="vis-pub">+</tspan> clusterDayEmotionPatterns(emotions: Emotion[]): DayPatternResult</text>
      <text x="0" y="60" class="method-text"><tspan class="vis-pub">+</tspan> synthesizeNaturalLanguageSummary(corrResult, impactResult): String[]</text>
    </g>
  </g>


  <!-- ========================================================================= -->
  <!-- ROW 2: USER AGGREGATE ROOT & EMBEDDED COMPONENTS                          -->
  <!-- ========================================================================= -->

  <!-- Session Component -->
  <g id="c-session" transform="translate(60, 480)">
    <rect width="320" height="180" class="uml-class c-data"/>
    <path d="M 0 10 Q 0 0 10 0 L 310 0 Q 320 0 320 10 L 320 48 L 0 48 Z" fill="#0e7490"/>
    <text x="160" y="22" class="stereotype">&laquo;Embedded Document&raquo;</text>
    <text x="160" y="40" class="class-title">Session</text>
    <line x1="0" y1="48" x2="320" y2="48" class="divider"/>
    <g transform="translate(16, 68)">
      <text x="0" y="0" class="attr-text"><tspan class="vis-pub">+</tspan> token: String (Refresh JWT)</text>
      <text x="0" y="20" class="attr-text"><tspan class="vis-pub">+</tspan> userAgent: String</text>
      <text x="0" y="40" class="attr-text"><tspan class="vis-pub">+</tspan> ip: String</text>
      <text x="0" y="60" class="attr-text"><tspan class="vis-pub">+</tspan> lastActive: Date = now()</text>
      <text x="0" y="80" class="attr-text"><tspan class="vis-pub">+</tspan> createdAt: Date = now()</text>
    </g>
  </g>

  <!-- User (Center Aggregate Root) -->
  <g id="c-user" transform="translate(560, 440)">
    <rect width="490" height="420" class="uml-class c-user"/>
    <path d="M 0 10 Q 0 0 10 0 L 480 0 Q 490 0 490 10 L 490 48 L 0 48 Z" fill="#312e81"/>
    <text x="245" y="22" class="stereotype">&laquo;Aggregate Root / Mongoose Model&raquo;</text>
    <text x="245" y="40" class="class-title">User</text>
    <line x1="0" y1="48" x2="490" y2="48" class="divider"/>
    <g transform="translate(16, 68)">
      <text x="0" y="0" class="attr-text"><tspan class="vis-priv">-</tspan> _id: ObjectId</text>
      <text x="0" y="20" class="attr-text"><tspan class="vis-pub">+</tspan> email: String { unique, lowercase, trim }</text>
      <text x="0" y="40" class="attr-text"><tspan class="vis-priv">-</tspan> passwordHash: String (Bcrypt salted)</text>
      <text x="0" y="60" class="attr-text"><tspan class="vis-pub">+</tspan> firstName: String [max: 30]</text>
      <text x="0" y="80" class="attr-text"><tspan class="vis-pub">+</tspan> lastName: String [max: 30]</text>
      <text x="0" y="100" class="attr-text"><tspan class="vis-pub">+</tspan> profilePicture: { url: String, publicId: String }</text>
      <text x="0" y="120" class="attr-text"><tspan class="vis-pub">+</tspan> country: String</text>
      <text x="0" y="140" class="attr-text"><tspan class="vis-pub">+</tspan> currency: String [len: 3, uppercase]</text>
      <text x="0" y="160" class="attr-text"><tspan class="vis-pub">+</tspan> pushSubscriptions: PushSubscription[]</text>
      <text x="0" y="180" class="attr-text"><tspan class="vis-pub">+</tspan> reminderSettings: ReminderSettings</text>
      <text x="0" y="200" class="attr-text"><tspan class="vis-pub">+</tspan> goals: Goals</text>
      <text x="0" y="220" class="attr-text"><tspan class="vis-pub">+</tspan> sessions: Session[]</text>
      <text x="0" y="240" class="attr-text"><tspan class="vis-pub">+</tspan> isDeleted: Boolean = false</text>
      <text x="0" y="260" class="attr-text"><tspan class="vis-pub">+</tspan> createdAt: Date = now()</text>
    </g>
    <line x1="0" y1="340" x2="490" y2="340" class="divider"/>
    <g transform="translate(16, 360)">
      <text x="0" y="0" class="method-text"><tspan class="vis-pub">+</tspan> generateTokens(): { accessToken: String, refreshToken: String }</text>
      <text x="0" y="20" class="method-text"><tspan class="vis-pub">+</tspan> comparePassword(candidatePassword: String): Promise&lt;Boolean&gt;</text>
      <text x="0" y="40" class="method-text"><tspan class="vis-pub">+</tspan> pruneSessions(activeTokens: String[]): Promise&lt;void&gt;</text>
    </g>
  </g>

  <!-- ReminderSettings Component -->
  <g id="c-reminders" transform="translate(1220, 440)">
    <rect width="360" height="200" class="uml-class c-data"/>
    <path d="M 0 10 Q 0 0 10 0 L 350 0 Q 360 0 360 10 L 360 48 L 0 48 Z" fill="#0e7490"/>
    <text x="180" y="22" class="stereotype">&laquo;Embedded Document&raquo;</text>
    <text x="180" y="40" class="class-title">ReminderSettings</text>
    <line x1="0" y1="48" x2="360" y2="48" class="divider"/>
    <g transform="translate(16, 68)">
      <text x="0" y="0" class="attr-text"><tspan class="vis-pub">+</tspan> habits: { enabled: Boolean, time: "09:00" }</text>
      <text x="0" y="20" class="attr-text"><tspan class="vis-pub">+</tspan> journal: { enabled: Boolean, time: "21:00" }</text>
      <text x="0" y="40" class="attr-text"><tspan class="vis-pub">+</tspan> tracking: { enabled: Boolean, time: "13:00" }</text>
      <text x="0" y="60" class="attr-text"><tspan class="vis-pub">+</tspan> dailyLog: { enabled: Boolean, time: "20:00" }</text>
      <text x="0" y="80" class="attr-text"><tspan class="vis-pub">+</tspan> timezone: String = "UTC"</text>
    </g>
    <line x1="0" y1="155" x2="360" y2="155" class="divider"/>
    <g transform="translate(16, 175)">
      <text x="0" y="0" class="method-text"><tspan class="vis-pub">+</tspan> isDue(currentUTCTime: String): Boolean</text>
    </g>
  </g>

  <!-- Goals Component -->
  <g id="c-goals" transform="translate(1220, 680)">
    <rect width="360" height="180" class="uml-class c-data"/>
    <path d="M 0 10 Q 0 0 10 0 L 350 0 Q 360 0 360 10 L 360 48 L 0 48 Z" fill="#0e7490"/>
    <text x="180" y="22" class="stereotype">&laquo;Embedded Document&raquo;</text>
    <text x="180" y="40" class="class-title">Goals</text>
    <line x1="0" y1="48" x2="360" y2="48" class="divider"/>
    <g transform="translate(16, 68)">
      <text x="0" y="0" class="attr-text"><tspan class="vis-pub">+</tspan> sleep: Number = 8 (hours)</text>
      <text x="0" y="20" class="attr-text"><tspan class="vis-pub">+</tspan> screenTime: Number = 3 (hours)</text>
      <text x="0" y="40" class="attr-text"><tspan class="vis-pub">+</tspan> work: Number = 6 (hours)</text>
      <text x="0" y="60" class="attr-text"><tspan class="vis-pub">+</tspan> expenses: Number = 50 (currency units)</text>
    </g>
  </g>


  <!-- ========================================================================= -->
  <!-- ROW 3: TELEMETRY ENTITIES (DailyEntry, Emotion, TimeTracker, LifeRating)   -->
  <!-- ========================================================================= -->

  <!-- DailyEntry -->
  <g id="c-daily" transform="translate(60, 940)">
    <rect width="400" height="240" class="uml-class c-entity"/>
    <path d="M 0 10 Q 0 0 10 0 L 390 0 Q 400 0 400 10 L 400 48 L 0 48 Z" fill="#075985"/>
    <text x="200" y="22" class="stereotype">&laquo;Mongoose Model&raquo;</text>
    <text x="200" y="40" class="class-title">DailyEntry</text>
    <line x1="0" y1="48" x2="400" y2="48" class="divider"/>
    <g transform="translate(16, 68)">
      <text x="0" y="0" class="attr-text"><tspan class="vis-priv">-</tspan> _id: ObjectId</text>
      <text x="0" y="20" class="attr-text"><tspan class="vis-pub">+</tspan> user: ObjectId &laquo;FK User&raquo;</text>
      <text x="0" y="40" class="attr-text"><tspan class="vis-pub">+</tspan> date: Date { index: { user: 1, date: 1 } (unique) }</text>
      <text x="0" y="60" class="attr-text"><tspan class="vis-pub">+</tspan> text: String</text>
      <text x="0" y="80" class="attr-text"><tspan class="vis-pub">+</tspan> rating: Number [0..10]</text>
      <text x="0" y="100" class="attr-text"><tspan class="vis-pub">+</tspan> tags: String[]</text>
      <text x="0" y="120" class="attr-text"><tspan class="vis-pub">+</tspan> lockedUntil: Date = now() + 24h</text>
    </g>
    <line x1="0" y1="195" x2="400" y2="195" class="divider"/>
    <g transform="translate(16, 215)">
      <text x="0" y="0" class="method-text"><tspan class="vis-pub">+</tspan> isLocked(): Boolean</text>
      <text x="0" y="20" class="method-text"><tspan class="vis-pub">+</tspan> exportToPDF(): Blob (client-side jsPDF)</text>
    </g>
  </g>

  <!-- Emotion -->
  <g id="c-emotion" transform="translate(540, 940)">
    <rect width="420" height="240" class="uml-class c-entity"/>
    <path d="M 0 10 Q 0 0 10 0 L 410 0 Q 420 0 420 10 L 420 48 L 0 48 Z" fill="#075985"/>
    <text x="210" y="22" class="stereotype">&laquo;Mongoose Model&raquo;</text>
    <text x="210" y="40" class="class-title">Emotion</text>
    <line x1="0" y1="48" x2="420" y2="48" class="divider"/>
    <g transform="translate(16, 68)">
      <text x="0" y="0" class="attr-text"><tspan class="vis-priv">-</tspan> _id: ObjectId</text>
      <text x="0" y="20" class="attr-text"><tspan class="vis-pub">+</tspan> user: ObjectId &laquo;FK User&raquo;</text>
      <text x="0" y="40" class="attr-text"><tspan class="vis-pub">+</tspan> date: Date { index: { user: 1, date: 1 } (unique) }</text>
      <text x="0" y="60" class="attr-text"><tspan class="vis-pub">+</tspan> emotion: ValidEmotion [happy, stressed, ...]</text>
      <text x="0" y="80" class="attr-text"><tspan class="vis-pub">+</tspan> lockedUntil: Date = now() + 24h</text>
      <text x="0" y="100" class="attr-text"><tspan class="vis-pub">+</tspan> createdAt: Date = now()</text>
      <text x="0" y="120" class="attr-text"><tspan class="vis-pub">+</tspan> updatedAt: Date</text>
    </g>
    <line x1="0" y1="195" x2="420" y2="195" class="divider"/>
    <g transform="translate(16, 215)">
      <text x="0" y="0" class="method-text"><tspan class="vis-pub">+</tspan> getNumericalValence(): Number [1.0..5.0]</text>
    </g>
  </g>

  <!-- TimeTracker -->
  <g id="c-timetracker" transform="translate(1040, 940)">
    <rect width="400" height="240" class="uml-class c-entity"/>
    <path d="M 0 10 Q 0 0 10 0 L 390 0 Q 400 0 400 10 L 400 48 L 0 48 Z" fill="#075985"/>
    <text x="200" y="22" class="stereotype">&laquo;Mongoose Model&raquo;</text>
    <text x="200" y="40" class="class-title">TimeTracker</text>
    <line x1="0" y1="48" x2="400" y2="48" class="divider"/>
    <g transform="translate(16, 68)">
      <text x="0" y="0" class="attr-text"><tspan class="vis-priv">-</tspan> _id: ObjectId</text>
      <text x="0" y="20" class="attr-text"><tspan class="vis-pub">+</tspan> user: ObjectId &laquo;FK User&raquo;</text>
      <text x="0" y="40" class="attr-text"><tspan class="vis-pub">+</tspan> date: Date { index: { user: 1, date: 1 } (unique) }</text>
      <text x="0" y="60" class="attr-text"><tspan class="vis-pub">+</tspan> sleep: Number &ge; 0</text>
      <text x="0" y="80" class="attr-text"><tspan class="vis-pub">+</tspan> screen: Number &ge; 0</text>
      <text x="0" y="100" class="attr-text"><tspan class="vis-pub">+</tspan> workStudy: Number &ge; 0</text>
      <text x="0" y="120" class="attr-text"><tspan class="vis-pub">+</tspan> expense: Number &ge; 0</text>
    </g>
    <line x1="0" y1="195" x2="400" y2="195" class="divider"/>
    <g transform="translate(16, 215)">
      <text x="0" y="0" class="method-text"><tspan class="vis-pub">+</tspan> validateDiurnalSum(): Boolean (&Sigma; hours &le; 24h)</text>
    </g>
  </g>

  <!-- LifeRating -->
  <g id="c-liferating" transform="translate(1520, 940)">
    <rect width="460" height="240" class="uml-class c-entity"/>
    <path d="M 0 10 Q 0 0 10 0 L 450 0 Q 460 0 460 10 L 460 48 L 0 48 Z" fill="#075985"/>
    <text x="230" y="22" class="stereotype">&laquo;Mongoose Model&raquo;</text>
    <text x="230" y="40" class="class-title">LifeRating</text>
    <line x1="0" y1="48" x2="460" y2="48" class="divider"/>

        <g transform="translate(20, 22)">

          <text x="0" y="18" font-size="11.5px" font-family="'JetBrains Mono', monospace" fill="#94a3b8">Enforced on DailyEntry, Emotion, TimeTracker, and LifeRating: schema.index({ user: 1, date: 1 }, { unique: true })</text>
          <text x="0" y="34" font-size="11px" fill="#64748b">Eliminates race conditions and prevents multiple submissions per user calendar date.</text>

          <text x="0" y="58" font-size="12px" font-weight="700" fill="#fbbf24">• 24-Hour Write-Lock Boundary:</text>
